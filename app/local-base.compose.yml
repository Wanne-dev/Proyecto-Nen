# Arranque local (solo loopback y saldo virtual).
name: nen-demo-accesos-796ed55771

x-backend: &backend
  image: banca-nen-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  volumes:
    - demo_auth_keys:/app/backend/.local
  environment:
    NODE_ENV: development
    APP_MODE: virtual
    HOST: 0.0.0.0
    PORT: '3000'
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_USER: banca_nen
    DB_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    DB_NAME: banca_nen
    DB_SSL: 'false'
    JWT_SECRET: ${JWT_SECRET:-}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    AUTH_KEY_FILE: /app/backend/.local/nen-auth.key
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}
    TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
    TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    MARKET_OFFLINE: ${MARKET_OFFLINE:-false}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: banca_nen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      POSTGRES_DB: banca_nen
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_demo_v17:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, banca_nen, -d, banca_nen]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-migrate:
    <<: *backend
    restart: 'no'
    command: [node, node_modules/typeorm/cli.js, migration:run, -d, dist/data-source.js]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:80'

  ia-service:
    profiles: [analisis]
    build: ./ia-service
    restart: unless-stopped
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Identificadores históricos: conservan los datos y las semillas TOTP existentes.
  postgres_demo_v17:
  demo_auth_keys:
