# ──────────────────────────────────────────────────────────────
# BANCA NEN — Stack completo en Docker
# Levántalo con:   docker compose up -d --build
# ──────────────────────────────────────────────────────────────
name: banca-nen

services:
  # ── Base de datos ──
  postgres:
    image: postgres:16-alpine
    container_name: banca_nen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banca_nen
      POSTGRES_PASSWORD: banca_nen_secret
      POSTGRES_DB: banca_nen
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banca_nen -d banca_nen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: banca_nen_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Backend (Express) — puerto 3000 ──
  backend:
    build: ./backend
    container_name: banca_nen_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3000
      NODE_ENV: production
      # Conexión a la base (usando el NOMBRE del servicio, no localhost)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: banca_nen
      DB_PASSWORD: banca_nen_secret
      DB_NAME: banca_nen
      DB_SSL: "false"
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # JWT — CAMBIA ESTOS SECRETOS ANTES DE PRODUCCIÓN
      JWT_SECRET: banca_nen_docker_secret_min_32_chars_change_me_2025
      JWT_ACCESS_SECRET: banca_nen_access_secret_min_32_chars_change_me_2025
      JWT_REFRESH_SECRET: banca_nen_refresh_secret_min_32_chars_change_me_2025
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      # Email (para pruebas usa el fallback por consola)
      EMAIL_FROM: "BANCA NEN <no-reply@bancanen.local>"
      # Frontend
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"

  # ── Frontend (React + Vite) — puerto 5173 ──
  frontend:
    build: ./frontend
    container_name: banca_nen_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # ── IA service (FastAPI) — puerto 8000 ──
  ia-service:
    build: ./ia-service
    container_name: banca_nen_ia
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
