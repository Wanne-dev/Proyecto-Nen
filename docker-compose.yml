# Nombre fijo del proyecto: asi Docker reconoce los mismos contenedores
# aunque cambie el nombre de la carpeta (Proyecto-nen-main, Proyecto-Nen-pnpm, etc.)
name: banca-nen

services:
  postgres:
    image: postgres:16-alpine
    container_name: banca_nen_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: banca_nen
      POSTGRES_PASSWORD: banca_nen_secret
      POSTGRES_DB: banca_nen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banca_nen -d banca_nen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: banca_nen_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
