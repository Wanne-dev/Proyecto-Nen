# ──────────────────────────────────────────────────────────────
# BANCA NEN — Stack completo en Docker
#
#   docker compose up -d --build      levantar todo
#   docker compose logs -f backend    ver los codigos de verificacion
#   docker compose down               parar
#   docker compose down -v            parar y BORRAR la base de datos
#
# La configuracion de correo se lee del archivo .env de ESTA carpeta.
# ──────────────────────────────────────────────────────────────
name: banca-nen

services:
  # ── Base de datos ──
  postgres:
    image: postgres:16-alpine
    container_name: banca_nen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banca_nen
      POSTGRES_PASSWORD: banca_nen_secret
      POSTGRES_DB: banca_nen
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banca_nen -d banca_nen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: banca_nen_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Backend (Express) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banca_nen_backend
    restart: unless-stopped
    # condition: service_healthy = esperar a que Postgres ACEPTE conexiones,
    # no solo a que el contenedor exista. Sin esto el backend arrancaba antes
    # de tiempo, fallaba la conexion y se cerraba.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production

      # ── Base de datos ──
      # "postgres" es el NOMBRE DEL SERVICIO. Dentro de la red de Docker se
      # resuelve solo. Nunca uses localhost aqui.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: banca_nen
      DB_PASSWORD: banca_nen_secret
      DB_NAME: banca_nen
      DB_SSL: "false"

      # ── Redis ──
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # ── JWT — CAMBIA ESTOS SECRETOS EN PRODUCCION ──
      JWT_SECRET: "${JWT_SECRET:-banca_nen_docker_secret_min_32_chars_change_me_2025}"
      JWT_EXPIRES_IN: "24h"
      JWT_REFRESH_EXPIRES_IN: "7d"

      # ── CORREO ──────────────────────────────────────────────
      # Se leen del archivo .env de la raiz del proyecto.
      # Sin configurar queda en "console": los codigos salen en
      #     docker compose logs -f backend
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-console}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-BANCA NEN <onboarding@resend.dev>}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"

      # ── SMS (opcional) ──
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER:-}"

      # URL que aparece en el enlace de recuperar contrasena
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Frontend (React + Vite servido por Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banca_nen_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"

  # ── IA service (FastAPI) ──
  ia-service:
    build: ./ia-service
    container_name: banca_nen_ia
    restart: unless-stopped
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
