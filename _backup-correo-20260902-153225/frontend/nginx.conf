# ──────────────────────────────────────────────────────────────
# BANCA NEN — Frontend (Nginx)
# Sirve la SPA y hace de proxy hacia el backend.
# ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador del usuario NO puede ver el contenedor "backend".
    # Por eso el frontend llama a /api (misma URL) y Nginx reenvia aqui dentro.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 10M;

    # SPA: cualquier ruta desconocida la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que un deploy nuevo se vea al instante
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── API → backend ─────────────────────────────────────────
    # OJO: "proxy_pass http://backend:3000" (sin barra final) conserva la ruta
    # completa, que es lo que queremos: /api/v1/auth/login llega igual.
    location /api/ {
        # Usamos una variable a proposito: obliga a Nginx a resolver el DNS en
        # cada peticion en vez de al arrancar. Si no, Nginx se niega a iniciar
        # cuando el contenedor "backend" todavia no existe, y el frontend
        # quedaba caido. $request_uri conserva la ruta y los parametros.
        set $upstream_backend "backend:3000";
        proxy_pass http://$upstream_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (socket.io)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # El registro envia un correo: puede tardar unos segundos
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Que los errores del backend lleguen tal cual al frontend
        proxy_intercept_errors off;
    }

    # Comprobar que Nginx esta vivo
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
