# ──────────────────────────────────────────────────────────────
# BANCA NEN — Frontend Nginx
# Sirve la app estática y hace proxy de /api hacia el backend.
# El backend se llama por su NOMBRE DE SERVICIO de compose: "backend"
# ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no encontrada → index.html (React Router)
    location / {
        try_files $uri /index.html;
    }

    # API → backend (puerto interno 3000)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
